name: Build ds4vita.skprx

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          mkdir build
          cd build
          cmake ..
          make

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: ds4vita-skprx
          path: build/ds4vita.skprx

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ds4vita.skprx (L1/R1 and L2/R2 swapped) build ${{ github.run_number }}
          body: Plugin built from this repo. Download ds4vita.skprx below and copy it to your Vita.
          files: build/ds4vita.skprx
